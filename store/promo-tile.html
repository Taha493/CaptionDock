<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CaptionDock promo tile</title>
    <!-- Source for store/promo-tile-440x280.png (render at exactly 440x280). -->
    <style>
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 30px;
        box-sizing: border-box;
        background: linear-gradient(135deg, #12161f 0%, #1d2533 100%);
        color: #fff;
        font-family: Roboto, "Noto Sans", Arial, sans-serif;
      }
      img {
        width: 104px;
        height: 104px;
        flex: none;
        border-radius: 23px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 10px 28px rgba(0, 0, 0, 0.55);
      }
      h1 { margin: 0 0 8px; font-size: 38px; font-weight: 700; letter-spacing: -0.5px; }
      p { margin: 0; font-size: 17px; line-height: 1.35; color: rgba(255, 255, 255, 0.78); }
      .line { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
      .line span { display: block; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.85); }
      .line span:nth-child(2) { width: 62%; background: #3ea6ff; }
    </style>
  </head>
  <body>
    <img src="../icons/icon128.png" alt="" />
    <div>
      <h1>CaptionDock</h1>
      <p>Video captions in a floating window that stays on top while you work.</p>
      <div class="line"><span></span><span></span></div>
    </div>
  </body>
</html>
